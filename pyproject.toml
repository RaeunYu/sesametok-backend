[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sesametok-backend"
version = "0.1.0"
description = "macOS-native, local-only backend that exposes KakaoTalk read / receive / send over a loopback API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "pyobjc-framework-Cocoa>=10.0",
  "pyobjc-framework-Quartz>=10.0",
  "pyobjc-framework-ApplicationServices>=10.0",
  # ADR-002: sqlcipher3-binary has no macOS/arm64 wheel; sqlcipher3 ships one.
  "sqlcipher3==0.6.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sesametok-backend = "sesametok_backend.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
